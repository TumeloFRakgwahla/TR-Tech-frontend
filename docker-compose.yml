version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tr-tech-frontend
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_SITE_URL=http://localhost
      - VITE_WHATSAPP_NUMBER=2712345678
      - VITE_PAYSTACK_PUBLIC_KEY=pk_test_REPLACE_WITH_ACTUAL_PUBLIC
    restart: unless-stopped
    networks:
      - tr-tech-network

networks:
  tr-tech-network:
    driver: bridge
